<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="votelyCoral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF385C" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#E11D48" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- 1. Outer Coral Squircle Background -->
  <rect x="32" y="32" width="448" height="448" rx="128" fill="url(#votelyCoral)" filter="url(#softGlow)" />

  <!-- 2. The Official Votely Voting Kiosk & Checkmark Mark -->
  <!-- Base Horizontal Platform -->
  <rect x="120" y="356" width="272" height="34" rx="17" fill="#FFFFFF" />

  <!-- Arched Voting Chamber / Booth Body -->
  <rect x="156" y="160" width="200" height="196" rx="48" fill="none" stroke="#FFFFFF" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" />

  <!-- White Checkmark in Center -->
  <path d="M216 260 L248 292 L300 236" fill="none" stroke="#FFFFFF" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" />
</svg>